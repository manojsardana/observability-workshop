mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

presets: {}

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

    batch: {}

  exporters:
    debug:
      verbosity: detailed

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]

      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]

      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
extraEnvs:
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
