mode: daemonset

image:
  repository: otel/opentelemetry-collector-k8s

presets: {}

config:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

    prometheus:
      config:
        scrape_configs:
          - job_name: "otel-demo"

            scrape_interval: 15s

            kubernetes_sd_configs:
              - role: pod

            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace]
                action: keep
                regex: otel-demo

              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: "true"

              - source_labels:
                  [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                action: replace
                regex: "([^:]+)(?::\\d+)?;(\\d+)"
                replacement: "$1:$2"
                target_label: __address__

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

    batch: {}

  exporters:
    debug:
      verbosity: detailed
    prometheusremotewrite:
      endpoint: "http://prometheus-server.monitoring.svc.cluster.local/api/v1/write"

  service:
    pipelines:
      metrics:
        receivers:
          - prometheus
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
          - prometheusremotewrite

      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug

      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
          - 
